version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tam_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tsehafi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tsehafi_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tam_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tsehafi} -d ${POSTGRES_DB:-tam_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tam_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
